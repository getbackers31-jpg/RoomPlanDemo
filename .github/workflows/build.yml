name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 1. 銝?撠?蝔?蝣?
        uses: actions/checkout@v4

      - name: 2. 蝺刻陌 iOS App嚗?蝪賜?璅∪?嚗?
        run: |
          xcodebuild -project RoomPlanDemo.xcodeproj \
            -scheme RoomPlanDemo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            INFOPLIST_KEY_CFBundleDisplayName="蝛粹???Pro"

      - name: 3. ????.ipa 摰?瑼?
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r RoomPlanDemo.ipa Payload

      - name: 4. 銝 .ipa 靘?頛?
        uses: actions/upload-artifact@v4
        with:
          name: RoomPlanDemo-IPA
          path: RoomPlanDemo.ipa
